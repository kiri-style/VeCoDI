# ==============================================================================s
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_REQUIRES_FLOAT_PRINTF=n
#CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CONNECTION_BASED_SERVICE_API=y
CONFIG_TFM_PARTITION_CRYPTO=y
CONFIG_TFM_IPC=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# ============================================================
# STM32L5 Hardware Crypto Acceleration
# ============================================================
# HW crypto is controlled by TF-M/platform defaults in this workspace.
# Keep only supported symbols here to avoid Kconfig aborts.
CONFIG_MBEDTLS_DEBUG=y

# CMSIS
CONFIG_CMSIS_NN=y

# Performance monitoring (for benchmarking)
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y


# Silence console/log output to avoid UART protocol interference
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SPM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_PARTITION_LOG_LEVEL_SILENCE=y
CONFIG_TFM_BL2_LOG_LEVEL_OFF=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=n



#CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=n
CONFIG_TFM_PARTITION_INITIAL_ATTESTATION=n
#CONFIG_TFM_PARTITION_PLATFORM=n
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
CONFIG_TFM_PARTITION_FIRMWARE_UPDATE=n


#CONFIG_USERSPACE=y
#CONFIG_THREAD_STACK_INFO=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y



